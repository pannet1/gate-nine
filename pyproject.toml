[project]
name = "gate-nine"
version = "0.1.0"
description = "Human-supervised black-box functional testing harness for Rachis"
requires-python = ">=3.12"
dependencies = [
  "pydantic-settings>=2.6,<3.0",
  "playwright>=1.48,<2.0",
  "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9.0"]

[tool.pytest.ini_options]
testpaths = ["app_tests"]
pythonpath = ["."]

